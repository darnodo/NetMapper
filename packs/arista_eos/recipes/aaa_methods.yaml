family: aaa_methods
implementations:
  - id: aaa-methods-cli
    versions: '>=4.36'   # only 4.36 recorded and scanned for secrets (research R13)
    transport: ssh
    steps:
      # EOS prints every list, configured or not, so this family is never empty on EOS (R13).
      - command: show aaa methods all | no-more
        template: show_aaa_methods_all.textfsm
    map: { type: TYPE, service: SERVICE, list: LIST, level: LEVEL, record: RECORD, methods: METHODS }
    values:
      type: { Authentication: authentication, Authorization: authorization, Accounting: accounting }
      service: { LOGIN: login, ENABLE: enable, EXEC: exec, COMMANDS: commands, SYSTEM: system, DOT1X: dot1x }
      record: { startStop: start-stop, stopOnly: stop-only, none: '' }
    split: { methods: ', ' }
