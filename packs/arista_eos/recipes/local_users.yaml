family: local_users
implementations:
  - id: users-cli
    versions: '>=4.20'
    transport: ssh
    steps:
      - command: show users accounts | no-more
        template: show_users_accounts.textfsm
    map: { name: NAME, role: ROLE, privilege: PRIVILEGE, ssh_key: SSHKEY }
    values:
      ssh_key: { '*': 'yes' }   # the public key itself is not kept
    defaults: { ssh_key: 'no' }
