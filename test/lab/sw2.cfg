hostname sw2
username admin privilege 15 role network-admin secret admin
username netmapper privilege 15 role network-operator secret admin
!
! Management configuration for feature 007 (device management facts). Every secret below is a
! dummy prefixed nm-lab-secret-, so the secret test can find any that leaks into a recording. The
! AAA, NTP, syslog and DNS servers are documentation addresses nobody answers on: `local` comes
! first in every method list, so no login waits on them. VRF MGMT is configuration only (EOS takes
! NTP servers in one VRF only, so both are in MGMT);
! Management0 stays in the default VRF and the crawl reaches the switch as before.
username nm-auto privilege 15 role network-admin secret nm-lab-secret-auto
username nm-auto ssh-key ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOgKydqV0kg/kEthK+UIkY66EIS+xPUgvdYVvoRCxXyO nm-auto@test-lab
username nm-ops privilege 1 role network-operator secret nm-lab-secret-ops
!
vrf instance MGMT
!
ip access-list standard NM-SNMP-RO
   10 permit 172.20.20.0/24
!
ip access-list standard NM-SNMP-RW
   10 permit 172.20.20.1/32
!
! EOS refuses a v3 user in the startup-config until an engineID exists, so it is pinned here.
snmp-server engineID local f5717f0000000000000002
snmp-server view all iso included
snmp-server group nm-ro v3 priv read all
snmp-server group nm-auth v3 auth read all
snmp-server user netmapper nm-ro v3 auth sha256 lab-auth-sw2 priv aes256 lab-priv-sw2
snmp-server user nm-authonly nm-auth v3 auth sha256 nm-lab-secret-authonly
! The crawl's community is not one of these, so sw2 is still read over SNMPv3 only.
snmp-server community nm-lab-secret-ro ro NM-SNMP-RO
snmp-server community nm-lab-secret-rw rw NM-SNMP-RW
snmp-server vrf MGMT
!
tacacs-server timeout 1
tacacs-server host 192.0.2.10 key 0 nm-lab-secret-tacacs
tacacs-server host 192.0.2.11 key 0 nm-lab-secret-tacacs
tacacs-server host 192.0.2.12 vrf MGMT key 0 nm-lab-secret-tacacs
!
radius-server timeout 1
radius-server host 192.0.2.20 key 0 nm-lab-secret-radius
!
aaa group server tacacs+ NM-TACACS
   server 192.0.2.10
   server 192.0.2.11
   server 192.0.2.12 vrf MGMT
!
aaa group server radius NM-RADIUS
   server 192.0.2.20
!
aaa authentication login default local group NM-TACACS
aaa authentication login console local
aaa authentication enable default local group NM-TACACS
aaa authorization exec default local group NM-TACACS
aaa authorization commands all default local group NM-TACACS
aaa accounting exec default start-stop group NM-TACACS
aaa accounting commands all default start-stop group NM-TACACS
!
! VLAN configuration for feature 008 (research R7): a trunk on Ethernet1 with native VLAN 99 and a
! pruned allowed list, Port-Channel10 (LACP) on Ethernet3 and Ethernet4 allowing every VLAN, access
! VLAN 10 on Ethernet5. VLAN 31 is suspended. EOS has no local
! VLAN shutdown (it refuses `shutdown` under a VLAN), so no VLAN here is `shutdown`.
vlan 10
   name USERS
!
vlan 20
   name SERVERS
!
vlan 30
   name LAB-30
!
vlan 31
   name SUSPENDED
   state suspend
!
vlan 32
   name LAB-32
!
vlan 40-49
!
vlan 99
   name NATIVE
!
interface Ethernet1
   switchport mode trunk
   switchport trunk native vlan 99
   switchport trunk allowed vlan 10,20,30-32,40-49,99
!
interface Ethernet3
   channel-group 10 mode active
!
interface Ethernet4
   channel-group 10 mode active
!
interface Ethernet5
   switchport mode access
   switchport access vlan 10
!
interface Port-Channel10
   switchport mode trunk
!
! Declared on sw2 only and allowed on no trunk.
vlan 50
   name SW2-ONLY
!
! Routed towards sw3, so EOS allocates an internal VLAN that `show vlan` must not list.
interface Ethernet2
   no switchport
!
! BGP configuration for feature 010 (research R10): the other end of sw1's password session
! (ipv4 unicast only, so sw1's ipv6 unicast is not negotiated), and a listen range sw1 connects into
! from its Loopback1, which gives a dynamic peer. No neighbour for sw1's Loopback0, so sw1's wrong-AS
! peer is never established.
ip routing
!
interface Vlan10
   ip address 10.0.10.2/24
!
interface Loopback0
   ip address 10.255.0.2/32
!
interface Loopback1
   ip address 10.255.0.12/32
!
ip route 10.255.0.1/32 10.0.10.1
ip route 10.255.1.0/24 10.0.10.1
!
router bgp 65102
   router-id 10.255.0.2
   bgp listen range 10.255.1.0/24 peer-group DYN remote-as 65101
   neighbor DYN peer group
   neighbor DYN ebgp-multihop 2
   neighbor 10.0.10.1 remote-as 65101
   neighbor 10.0.10.1 password nm-lab-secret-bgp
   neighbor 10.0.10.1 description TO-SW1
   !
   address-family ipv4
      neighbor DYN activate
      neighbor 10.0.10.1 activate
!
! OSPF configuration for feature 011 (research R10). SVIs on VLANs 41 to 44, already declared and
! trunked, so no new link or VLAN. VLAN 41: area 0 with md5. VLAN 42: area 1 (written as an integer
! on purpose, spec FR-003) as a stub, point-to-point. VLAN 43: instance 2 in VRF blue with sha.
! VLAN 44: area 0, MTU mismatch (sw2 runs 1400) that holds the adjacency below full. Loopback0 is
! passive in area 0. OSPF keys are 16 characters at most, hence the short nm-lab-secret- keys.
vrf instance blue
!
ip routing vrf blue
!
interface Vlan41
   ip address 10.0.41.2/30
   ip ospf authentication message-digest
   ip ospf message-digest-key 1 md5 nm-lab-secret-m5
!
interface Vlan42
   ip address 10.0.42.2/30
   ip ospf network point-to-point
!
interface Vlan43
   vrf blue
   ip address 10.0.43.2/30
   ip ospf authentication message-digest
   ip ospf message-digest-key 1 sha256 nm-lab-secret-sh
!
interface Vlan44
   mtu 1400
   ip address 10.0.44.2/30
!
router ospf 1
   router-id 10.255.0.2
   passive-interface Loopback0
   network 10.255.0.2/32 area 0.0.0.0
   network 10.0.41.0/30 area 0.0.0.0
   network 10.0.44.0/30 area 0.0.0.0
   network 10.0.42.0/30 area 1
   area 1 stub
!
router ospf 2 vrf blue
   router-id 10.255.2.2
   network 10.0.43.0/30 area 0.0.0.0
!
lldp management-address Management0
!
interface Management0
   ip address 172.20.20.3/24
!
management api gnmi
   transport grpc default
!
management api http-commands
   no shutdown
   !
   vrf MGMT
      no shutdown
!
management api netconf
   transport ssh default
!
management ssh
   no shutdown
!
management telnet
   shutdown
!
ntp authentication-key 1 sha1 nm-lab-secret-ntp
ntp server vrf MGMT 192.0.2.30
ntp server vrf MGMT 192.0.2.31
!
logging host 192.0.2.40
logging host 192.0.2.41 1514
logging vrf MGMT host 192.0.2.42
!
ip name-server vrf default 192.0.2.50
ip name-server vrf MGMT 192.0.2.51
!
end
