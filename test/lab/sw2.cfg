hostname sw2
username admin privilege 15 role network-admin secret admin
username netmapper privilege 1 role network-operator secret admin
!
! EOS refuses a v3 user in the startup-config until an engineID exists, so it is pinned here.
snmp-server engineID local f5717f0000000000000002
snmp-server view all iso included
snmp-server group nm-ro v3 priv read all
snmp-server user netmapper nm-ro v3 auth sha256 lab-auth-sw2 priv aes256 lab-priv-sw2
!
lldp management-address Management0
!
interface Management0
   ip address 172.20.20.3/24
!
management ssh
   no shutdown
!
end
