hostname sw1
username admin privilege 15 role network-admin secret admin
username netmapper privilege 15 role network-operator secret admin
!
! The netmapper account lands in privileged exec (privilege 15) with a read-only role: the management
! facts of feature 007 need it. EOS applies a local privilege only with exec authorization.
aaa authorization exec default local
!
snmp-server community public ro
!
! VLAN configuration for feature 008 (research R7): a trunk on Ethernet1 with native VLAN 99 and a
! pruned allowed list, Port-Channel10 (LACP) on Ethernet2 and Ethernet3 allowing every VLAN, access
! VLAN 10 on Ethernet4. VLAN 31 is suspended. EOS has no local
! VLAN shutdown (it refuses `shutdown` under a VLAN), so no VLAN here is `shutdown`.
vlan 10
   name USERS
!
vlan 20
   name SERVERS
!
vlan 30
   name LAB-30
!
vlan 31
   name SUSPENDED
   state suspend
!
vlan 32
   name LAB-32
!
vlan 40-49
!
vlan 99
   name NATIVE
!
interface Ethernet1
   switchport mode trunk
   switchport trunk native vlan 99
   switchport trunk allowed vlan 10,20,30-32,40-49,99
!
interface Ethernet2
   channel-group 10 mode active
!
interface Ethernet3
   channel-group 10 mode active
!
interface Ethernet4
   switchport mode access
   switchport access vlan 10
!
interface Port-Channel10
   switchport mode trunk
!
! BGP configuration for feature 010 (research R10). sw1 (AS 65101) and sw2 (AS 65102) peer over an
! SVI on VLAN 10, which both trunks already carry. Four sessions on sw1: 10.0.10.2 is established,
! has a password and a description, and activates ipv6 unicast on sw1 only (sw2 does not, so the
! family is configured and not negotiated); 10.255.0.2 has a wrong remote AS; 10.0.10.99 is shut;
! 10.255.0.12 is sourced from Loopback1 into sw2's listen range, so sw2 sees a dynamic peer. The
! password is a dummy prefixed nm-lab-secret-, which the secret test looks for.
ip routing
!
interface Vlan10
   ip address 10.0.10.1/24
!
interface Loopback0
   ip address 10.255.0.1/32
!
interface Loopback1
   ip address 10.255.1.1/32
!
ip route 10.255.0.2/32 10.0.10.2
ip route 10.255.0.12/32 10.0.10.2
!
router bgp 65101
   router-id 10.255.0.1
   neighbor 10.0.10.2 remote-as 65102
   neighbor 10.0.10.2 password nm-lab-secret-bgp
   neighbor 10.0.10.2 description TO-SW2
   neighbor 10.255.0.2 remote-as 65199
   neighbor 10.255.0.2 update-source Loopback0
   neighbor 10.255.0.2 ebgp-multihop 2
   neighbor 10.0.10.99 remote-as 65102
   neighbor 10.0.10.99 shutdown
   neighbor 10.255.0.12 remote-as 65102
   neighbor 10.255.0.12 update-source Loopback1
   neighbor 10.255.0.12 ebgp-multihop 2
   !
   address-family ipv4
      neighbor 10.0.10.2 activate
      neighbor 10.255.0.2 activate
      neighbor 10.0.10.99 activate
      neighbor 10.255.0.12 activate
   !
   address-family ipv6
      neighbor 10.0.10.2 activate
!
! OSPF configuration for feature 011 (research R10). SVIs on VLANs 41 to 44, already declared and
! trunked, so no new link or VLAN. VLAN 41: area 0 with md5. VLAN 42: area 1 (written as an integer
! on purpose, spec FR-003) as a stub, point-to-point. VLAN 43: instance 2 in VRF blue with sha.
! VLAN 44: area 0, MTU mismatch (sw2 runs 1400) that holds the adjacency below full. Loopback0 is
! passive in area 0. OSPF keys are 16 characters at most, hence the short nm-lab-secret- keys.
vrf instance blue
!
ip routing vrf blue
!
interface Vlan41
   ip address 10.0.41.1/30
   ip ospf authentication message-digest
   ip ospf message-digest-key 1 md5 nm-lab-secret-m5
!
interface Vlan42
   ip address 10.0.42.1/30
   ip ospf network point-to-point
!
interface Vlan43
   vrf blue
   ip address 10.0.43.1/30
   ip ospf authentication message-digest
   ip ospf message-digest-key 1 sha256 nm-lab-secret-sh
!
interface Vlan44
   ip address 10.0.44.1/30
!
router ospf 1
   router-id 10.255.0.1
   passive-interface Loopback0
   network 10.255.0.1/32 area 0.0.0.0
   network 10.0.41.0/30 area 0.0.0.0
   network 10.0.44.0/30 area 0.0.0.0
   network 10.0.42.0/30 area 1
   area 1 stub
!
router ospf 2 vrf blue
   router-id 10.255.2.1
   network 10.0.43.0/30 area 0.0.0.0
!
lldp management-address Management0
!
interface Management0
   ip address 172.20.20.2/24
!
management ssh
   no shutdown
!
end
