! quickstart.md section 4: a clone of sw1. Same serial, its own chassis MAC, so the two contradict
! each other on a strong identifier and identity resolution must refuse to merge them.
hostname sw4
username admin privilege 15 role network-admin secret admin
username netmapper privilege 1 role network-operator secret admin
!
snmp-server community public ro
!
lldp management-address Management0
!
interface Management0
   ip address 172.20.20.5/24
!
management ssh
   no shutdown
!
end
