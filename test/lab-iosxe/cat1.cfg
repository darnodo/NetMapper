! Startup configuration of cat1 (Cat9kv 17.15.01). vrnetlab writes a bootstrap configuration
! (hostname, the admin account, the vty lines, the Mgmt-vrf route, GigabitEthernet0/0), appends this
! file to it, and IOS-XE applies the whole thing once, at first boot (research R6). So this file must
! not configure GigabitEthernet0/0, Mgmt-vrf, the vty lines or the admin account, and a change to it
! takes effect only on a new deploy (12 minutes or more).
hostname cat1
!
! Privilege 1: the account cannot enter privileged exec or configuration mode (spec FR-016).
username netmapper privilege 1 secret admin
!
lldp run
snmp-server community public RO
!
vlan 10
 name users
vlan 20
 name voice
vlan 99
 name native
!
interface Port-channel1
 switchport trunk native vlan 99
 switchport trunk allowed vlan 10,20,99
 switchport mode trunk
!
interface GigabitEthernet1/0/1
 switchport trunk native vlan 99
 switchport trunk allowed vlan 10,20,99
 switchport mode trunk
 channel-group 1 mode active
!
interface GigabitEthernet1/0/2
 switchport trunk native vlan 99
 switchport trunk allowed vlan 10,20,99
 switchport mode trunk
 channel-group 1 mode active
!
interface GigabitEthernet1/0/3
 switchport mode access
 switchport access vlan 10
