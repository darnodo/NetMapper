hostname eos-b
username admin privilege 15 role network-admin secret admin
username netmapper privilege 15 role network-operator secret admin
!
! As on test/lab: the netmapper account lands in privileged exec with a read-only role, which EOS
! applies only with exec authorization.
aaa authorization exec default local
!
snmp-server community public ro
!
vlan 10
!
! Ethernet1 towards cat1 Gi1/0/3, access VLAN 10. eos-b is known only through cat1's LLDP.
interface Ethernet1
   switchport access vlan 10
!
lldp management-address Management0
!
! LLDP is turned off on Management0 by the `exec` of iosxe.clab.yaml: containerlab rewrites this
! block on deploy.
interface Management0
   ip address 172.20.22.4/24
!
management ssh
   no shutdown
!
end
