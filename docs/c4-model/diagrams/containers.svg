<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img" aria-label="Container view: a web UI and an API face users, an engine computes and schedules, a collector holds the credentials and talks to devices, and both stores sit behind them.">
  <defs>
    <marker id="c-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor"/>
    </marker>
  </defs>

  <g font-family="IBM Plex Sans, system-ui, sans-serif" fill="currentColor">

    <!-- boundary -->
    <rect x="150" y="60" width="580" height="600" rx="10" fill="none" stroke="currentColor" stroke-width="1.2" stroke-dasharray="6 5" opacity="0.55"/>
    <text x="166" y="84" font-size="12" letter-spacing="0.08em" opacity="0.7">NETMAPPER, ONE IMAGE, THREE ROLES</text>

    <!-- actors -->
    <g>
      <rect x="10" y="110" width="120" height="58" rx="29" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <text x="70" y="137" text-anchor="middle" font-size="12.5" font-weight="600">Network</text>
      <text x="70" y="153" text-anchor="middle" font-size="12.5" font-weight="600">engineer</text>
    </g>
    <g>
      <rect x="10" y="240" width="120" height="58" rx="29" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <text x="70" y="267" text-anchor="middle" font-size="12.5" font-weight="600">AI agent</text>
      <text x="70" y="283" text-anchor="middle" font-size="10.5" opacity="0.7">over MCP</text>
    </g>

    <!-- containers -->
    <g>
      <rect x="180" y="110" width="170" height="72" rx="6" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <text x="265" y="140" text-anchor="middle" font-size="14" font-weight="600">Web UI</text>
      <text x="265" y="159" text-anchor="middle" font-size="10.5" opacity="0.7">React, tables first</text>
      <text x="265" y="174" text-anchor="middle" font-size="10.5" opacity="0.7">no credentials</text>
    </g>

    <g>
      <rect x="420" y="110" width="180" height="72" rx="6" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <text x="510" y="140" text-anchor="middle" font-size="14" font-weight="600">api</text>
      <text x="510" y="159" text-anchor="middle" font-size="10.5" opacity="0.7">Go, REST and MCP</text>
      <text x="510" y="174" text-anchor="middle" font-size="10.5" opacity="0.7">the only exposed role</text>
    </g>

    <g>
      <rect x="180" y="270" width="180" height="86" rx="6" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <text x="270" y="299" text-anchor="middle" font-size="14" font-weight="600">engine</text>
      <text x="270" y="318" text-anchor="middle" font-size="10.5" opacity="0.7">Go, resolution, graph,</text>
      <text x="270" y="333" text-anchor="middle" font-size="10.5" opacity="0.7">diff, reconciliation,</text>
      <text x="270" y="348" text-anchor="middle" font-size="10.5" opacity="0.7">scheduler, maintenance</text>
    </g>

    <g>
      <rect x="440" y="270" width="200" height="86" rx="6" fill="none" stroke="#b8672a" stroke-width="2.2"/>
      <text x="540" y="299" text-anchor="middle" font-size="14" font-weight="600" fill="#b8672a">collector</text>
      <text x="540" y="318" text-anchor="middle" font-size="10.5" opacity="0.8">Go, finder and scraper</text>
      <text x="540" y="333" text-anchor="middle" font-size="10.5" opacity="0.8">the only role holding</text>
      <text x="540" y="348" text-anchor="middle" font-size="10.5" opacity="0.8">device credentials</text>
    </g>

    <g>
      <rect x="180" y="470" width="180" height="86" rx="6" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <text x="270" y="500" text-anchor="middle" font-size="14" font-weight="600">PostgreSQL</text>
      <text x="270" y="519" text-anchor="middle" font-size="10.5" opacity="0.7">config, jobs, frontier,</text>
      <text x="270" y="534" text-anchor="middle" font-size="10.5" opacity="0.7">observations, graph</text>
    </g>

    <g>
      <rect x="440" y="470" width="200" height="86" rx="6" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <text x="540" y="500" text-anchor="middle" font-size="14" font-weight="600">Object store</text>
      <text x="540" y="519" text-anchor="middle" font-size="10.5" opacity="0.7">S3 API, Garage</text>
      <text x="540" y="534" text-anchor="middle" font-size="10.5" opacity="0.7">raw output, by hash</text>
    </g>

    <!-- externals -->
    <g>
      <rect x="790" y="270" width="190" height="66" rx="6" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <text x="885" y="298" text-anchor="middle" font-size="13" font-weight="600">Network devices</text>
      <text x="885" y="316" text-anchor="middle" font-size="10.5" opacity="0.7">SSH, SNMP</text>
    </g>
    <g>
      <rect x="790" y="380" width="190" height="66" rx="6" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <text x="885" y="408" text-anchor="middle" font-size="13" font-weight="600">Vault or OpenBao</text>
      <text x="885" y="426" text-anchor="middle" font-size="10.5" opacity="0.7">credentials</text>
    </g>
    <g>
      <rect x="790" y="110" width="190" height="66" rx="6" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <text x="885" y="138" text-anchor="middle" font-size="13" font-weight="600">NetBox</text>
      <text x="885" y="156" text-anchor="middle" font-size="10.5" opacity="0.7">intent</text>
    </g>
    <g>
      <rect x="790" y="490" width="190" height="66" rx="6" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <text x="885" y="518" text-anchor="middle" font-size="13" font-weight="600">Grafana</text>
      <text x="885" y="536" text-anchor="middle" font-size="10.5" opacity="0.7">read-only on the base</text>
    </g>

    <!-- arrows -->
    <g stroke="currentColor" stroke-width="1.4" fill="none" marker-end="url(#c-ah)">
      <line x1="130" y1="139" x2="176" y2="139"/>
      <line x1="350" y1="146" x2="416" y2="146"/>
      <polyline points="130,269 400,269 400,186"/>
      <polyline points="510,186 510,220 300,220 300,266"/>
      <line x1="270" y1="360" x2="270" y2="466"/>
      <polyline points="490,360 490,400 330,400 330,466"/>
      <line x1="580" y1="360" x2="580" y2="466"/>
      <polyline points="360,320 436,320"/>
      <line x1="644" y1="303" x2="786" y2="303"/>
      <polyline points="600,356 700,356 700,413 786,413"/>
      <polyline points="786,143 700,143 700,240 360,240 360,266"/>
      <polyline points="786,523 700,523 700,513 364,513"/>
    </g>

    <g font-size="10.5" text-anchor="middle" opacity="0.85">
      <text x="153" y="131">HTTPS</text>
      <text x="383" y="139">JSON</text>
      <text x="400" y="258">MCP and REST</text>
      <text x="404" y="212">enqueues jobs</text>
      <text x="222" y="418">projections,</text>
      <text x="222" y="432">gate, diff</text>
      <text x="410" y="392">replay reads</text>
      <text x="410" y="446">raw output</text>
      <text x="628" y="418">writes raw</text>
      <text x="628" y="432">output</text>
      <text x="398" y="312">claims tasks,</text>
      <text x="398" y="336">writes observations</text>
      <text x="715" y="295">read-only commands</text>
      <text x="742" y="378">resolves secrets</text>
      <text x="530" y="232">imports intent</text>
      <text x="540" y="506">reads for dashboards</text>
    </g>

  </g>
</svg>
