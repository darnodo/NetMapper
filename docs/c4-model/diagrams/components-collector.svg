<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 660" role="img" aria-label="Components of the collector: a worker pool claims find and scrape tasks, the fingerprinter identifies a device, the recipe engine runs commands through the transports, the parser maps output to schemas, and the writer stores raw output and observations.">
  <defs>
    <marker id="k-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor"/>
    </marker>
  </defs>
  <g font-family="IBM Plex Sans, system-ui, sans-serif" fill="currentColor">

    <rect x="40" y="40" width="700" height="480" rx="10" fill="none" stroke="currentColor" stroke-width="1.2" stroke-dasharray="6 5" opacity="0.5"/>
    <text x="56" y="64" font-size="12" letter-spacing="0.08em" opacity="0.7">COLLECTOR</text>

    <!-- control column -->
    <g>
      <rect x="66" y="86" width="176" height="62" rx="5" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <text x="154" y="112" text-anchor="middle" font-size="13" font-weight="600">Worker pool</text>
      <text x="154" y="130" text-anchor="middle" font-size="10" opacity="0.7">claims find and scrape,</text>
      <text x="154" y="143" text-anchor="middle" font-size="10" opacity="0.7">holds the lease</text>
    </g>
    <g>
      <rect x="66" y="182" width="176" height="54" rx="5" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <text x="154" y="206" text-anchor="middle" font-size="13" font-weight="600">Boundary check</text>
      <text x="154" y="224" text-anchor="middle" font-size="10" opacity="0.7">perimeter, hops, deny list</text>
    </g>
    <g>
      <rect x="66" y="270" width="176" height="62" rx="5" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <text x="154" y="296" text-anchor="middle" font-size="13" font-weight="600">Probe</text>
      <text x="154" y="314" text-anchor="middle" font-size="10" opacity="0.7">unauthenticated,</text>
      <text x="154" y="327" text-anchor="middle" font-size="10" opacity="0.7">classifies an endpoint</text>
    </g>

    <!-- pipeline column -->
    <g>
      <rect x="292" y="86" width="196" height="62" rx="5" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <text x="390" y="112" text-anchor="middle" font-size="13" font-weight="600">Fingerprinter</text>
      <text x="390" y="130" text-anchor="middle" font-size="10" opacity="0.7">SNMP first, one SSH</text>
      <text x="390" y="143" text-anchor="middle" font-size="10" opacity="0.7">command otherwise</text>
    </g>
    <g>
      <rect x="292" y="182" width="196" height="72" rx="5" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <text x="390" y="208" text-anchor="middle" font-size="13" font-weight="600">Recipe engine</text>
      <text x="390" y="226" text-anchor="middle" font-size="10" opacity="0.7">picks the implementation,</text>
      <text x="390" y="239" text-anchor="middle" font-size="10" opacity="0.7">runs the steps, merges</text>
    </g>
    <g>
      <rect x="292" y="288" width="196" height="72" rx="5" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <text x="390" y="314" text-anchor="middle" font-size="13" font-weight="600">Parser and mapper</text>
      <text x="390" y="332" text-anchor="middle" font-size="10" opacity="0.7">TextFSM, post-processing,</text>
      <text x="390" y="345" text-anchor="middle" font-size="10" opacity="0.7">map to schema, normalise</text>
    </g>
    <g>
      <rect x="292" y="394" width="196" height="62" rx="5" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <text x="390" y="420" text-anchor="middle" font-size="13" font-weight="600">Writer</text>
      <text x="390" y="438" text-anchor="middle" font-size="10" opacity="0.7">raw by hash, observations,</text>
      <text x="390" y="451" text-anchor="middle" font-size="10" opacity="0.7">identifier claims</text>
    </g>

    <!-- support column -->
    <g>
      <rect x="540" y="86" width="176" height="62" rx="5" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <text x="628" y="112" text-anchor="middle" font-size="13" font-weight="600">Transports</text>
      <text x="628" y="130" text-anchor="middle" font-size="10" opacity="0.7">SSH sessions,</text>
      <text x="628" y="143" text-anchor="middle" font-size="10" opacity="0.7">SNMP client</text>
    </g>
    <g>
      <rect x="540" y="182" width="176" height="72" rx="5" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <text x="628" y="208" text-anchor="middle" font-size="13" font-weight="600">Pack registry</text>
      <text x="628" y="226" text-anchor="middle" font-size="10" opacity="0.7">fingerprint rules, recipes,</text>
      <text x="628" y="239" text-anchor="middle" font-size="10" opacity="0.7">templates, naming rules</text>
    </g>
    <g>
      <rect x="540" y="288" width="176" height="62" rx="5" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <text x="628" y="314" text-anchor="middle" font-size="13" font-weight="600">Secret resolver</text>
      <text x="628" y="332" text-anchor="middle" font-size="10" opacity="0.7">reference to value,</text>
      <text x="628" y="345" text-anchor="middle" font-size="10" opacity="0.7">memory only</text>
    </g>

    <!-- outside -->
    <g>
      <rect x="810" y="86" width="196" height="62" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <text x="908" y="118" text-anchor="middle" font-size="13" font-weight="600">Network devices</text>
      <text x="908" y="136" text-anchor="middle" font-size="10" opacity="0.7">SSH and SNMP</text>
    </g>
    <g>
      <rect x="810" y="288" width="196" height="62" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <text x="908" y="320" text-anchor="middle" font-size="13" font-weight="600">Vault or OpenBao</text>
    </g>
    <g>
      <rect x="180" y="566" width="220" height="58" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <text x="290" y="592" text-anchor="middle" font-size="13" font-weight="600">PostgreSQL</text>
      <text x="290" y="609" text-anchor="middle" font-size="10" opacity="0.7">frontier, observations, claims</text>
    </g>
    <g>
      <rect x="440" y="566" width="200" height="58" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <text x="540" y="592" text-anchor="middle" font-size="13" font-weight="600">Object store</text>
      <text x="540" y="609" text-anchor="middle" font-size="10" opacity="0.7">raw output</text>
    </g>

    <!-- arrows -->
    <g stroke="currentColor" stroke-width="1.4" fill="none" marker-end="url(#k-ah)">
      <line x1="154" y1="152" x2="154" y2="178"/>
      <polyline points="242,205 268,205 268,117 288,117"/>
      <line x1="390" y1="152" x2="390" y2="178"/>
      <line x1="390" y1="258" x2="390" y2="284"/>
      <line x1="390" y1="364" x2="390" y2="390"/>
      <line x1="488" y1="212" x2="536" y2="212"/>
      <polyline points="488,205 512,205 512,117 536,117"/>
      <polyline points="716,117 806,117"/>
      <polyline points="716,318 806,318"/>
      <polyline points="628,152 628,175"/>
      <polyline points="628,282 628,262"/>
      <polyline points="292,425 260,425 260,562"/>
      <polyline points="488,425 520,425 520,562"/>
      <polyline points="154,150 120,150 120,545 176,545 176,566"/>
      <polyline points="242,300 268,300 268,330 288,330"/>
    </g>

    <g font-size="10" text-anchor="middle" opacity="0.85">
      <text x="192" y="168">every task</text>
      <text x="268" y="188">find task</text>
      <text x="437" y="170">platform,</text>
      <text x="437" y="182">identifiers</text>
      <text x="437" y="276">raw output</text>
      <text x="437" y="382">rows</text>
      <text x="512" y="200">recipes</text>
      <text x="512" y="132">rules</text>
      <text x="762" y="108">commands</text>
      <text x="762" y="310">resolves</text>
      <text x="672" y="168">creds</text>
      <text x="672" y="276">creds</text>
      <text x="222" y="500">writes</text>
      <text x="560" y="500">writes</text>
      <text x="106" y="420">claims</text>
      <text x="106" y="434">tasks</text>
      <text x="268" y="350">endpoint</text>
    </g>

  </g>
</svg>
