# Test agent only: one SNMPv3 user per protocol combination the tests exercise. The passphrases are
# dummy values, auth-<user> and priv-<user>; internal/transport/snmp/snmp_test.go builds them the same way.
agentAddress udp:161
sysName nm-snmpd

createUser nm-sha-aes       SHA     auth-nm-sha-aes       AES       priv-nm-sha-aes
createUser nm-sha256-aes    SHA-256 auth-nm-sha256-aes    AES       priv-nm-sha256-aes
createUser nm-sha512-aes256 SHA-512 auth-nm-sha512-aes256 AES-256   priv-nm-sha512-aes256
createUser nm-sha-aes256c   SHA     auth-nm-sha-aes256c   AES-256-C priv-nm-sha-aes256c
createUser nm-sha256-nopriv SHA-256 auth-nm-sha256-nopriv

rouser nm-sha-aes
rouser nm-sha256-aes
rouser nm-sha512-aes256
rouser nm-sha-aes256c
rouser nm-sha256-nopriv auth
