# gitleaks configuration: the default rules, minus the fixed values of the development stack.
# Each allowlisted value is a dummy committed on purpose (deploy/compose.yaml, deploy/garage.toml,
# test helpers, quickstarts). Values are listed exactly, not by file, so a real secret committed
# anywhere, these files included, is still reported.

[extend]
useDefault = true

[[allowlists]]
description = "development stack credentials, not secrets"
regexTarget = "secret"
regexes = [
  '''^GK0123456789abcdef01234567$''',                                         # S3 access key
  '''^0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef$''',   # S3 secret key
  '''^netmapper-dev-admin-token$''',                                          # Garage admin token
  '''^4a1c3f0e9d8b7a6c5e4d3c2b1a0f9e8d7c6b5a4f3e2d1c0b9a8f7e6d5c4b3a29$''',   # Garage rpc_secret
]

[[allowlists]]
description = "an API host and port in example curl commands, read as a credential"
regexTarget = "match"
regexes = ['''api:8080/v1/''']
